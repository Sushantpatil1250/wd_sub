<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 5 - Image</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5dc; /* light beige background */
            margin: 0;
            text-align: center;
        }

        header {
            background-color: #f77504d2;
            color: rgb(17, 17, 16);
            padding: 15px;
        }

        h1, h3 {
            margin: 5px;
        }

        main {
            background-color: white;
            width: 60%;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        img {
            border: 3px solid #2c3e50;
            border-radius: 10px;
            margin-top: 10px;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Assignment 5</h1>
        <h3>Name: Sushant Sudhakar Patil</h3>
        <h3>Roll No: 96</h3>
    </header>

    <main>
        <h3>Adding Image Using Image Tag</h3>

        <p>This is an example of image with image map:</p>

        <img src="pro.jpg" alt="HTML Image" usemap="#html" width="300">

        <map name="html">
            <area shape="rect" coords="0,0,150,150" href="https://www.google.com" alt="Click Area">
        </map>
    </main>

</body>
</html>

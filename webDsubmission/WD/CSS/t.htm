<!DOCTYPE html>
<html>
<head>
    <title>Single Page with CSS</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
            color: #333;
        }

        img {
            width: 400px;
            height: auto;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>

</head>
<body>

    <h1>My Image Page</h1>

    <img src="pro.jpg" alt="Sample Image">

</body>
</html>
